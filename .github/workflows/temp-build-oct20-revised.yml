name: Temporary build revised ECE 598 Oct 20 materials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-build-oct20-revised.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary materials branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-temp-build-oct20-2026

      - name: Patch temporary LaTeX source
        working-directory: teaching_oct20_revised
        run: |
          python - <<'PY'
          from pathlib import Path
          theme = Path('ece598_theme.tex')
          t = theme.read_text().replace(r'\newcommand{\accent}', r'\newcommand{\tealaccent}')
          theme.write_text(t)

          content = Path('lecture17_content.tex')
          t = content.read_text().replace(r'\accent{', r'\tealaccent{')
          t = t.replace(r'\draw[navy,very thick] (0.7,2.45) -- (14.1,2.45);', r'\draw[navy,very thick] (0.7,2.45) -- (13.25,2.45);')
          t = t.replace(r'\foreach \x in {1.0,5.4,9.6,13.7}', r'\foreach \x in {1.0,5.0,9.0,13.0}')
          t = t.replace('at (5.4,2.63)', 'at (5.0,2.63)').replace('at (5.4,2.25)', 'at (5.0,2.25)')
          t = t.replace('at (9.6,2.63)', 'at (9.0,2.63)').replace('at (9.6,2.25)', 'at (9.0,2.25)')
          t = t.replace('at (13.7,2.63)', 'at (13.0,2.63)').replace('at (13.7,2.25)', 'at (13.0,2.25)')

          needle = ' K_{t+1}=F(K_t)'
          pos = t.index(needle)
          a = t.rfind(r'\[', 0, pos)
          b = t.index(r'\]', pos) + 2
          eq = '\n'.join([
              r'{\scriptsize',
              r'\[',
              r'\begin{aligned}',
              r'K_{t+1}&=F(K_t)\\',
              r'&=\mathbb E_Z\!\left[\phi_g\!\left(\sqrt{K_t}Z\right)^2\right],\\',
              r'&\hspace{2.0cm} Z\sim\mathcal N(0,1).',
              r'\end{aligned}',
              r'\]}'])
          t = t[:a] + eq + t[b:]

          t = t.replace(r'\begin{frame}{From the tangent map to a scalar mean-field closure}' + '\n' + r'\kicker{The missing derivation}' + '\n' + r'\small', r'\begin{frame}{From the tangent map to a scalar mean-field closure}' + '\n' + r'\kicker{The missing derivation}' + '\n' + r'\fontsize{7.8}{9.2}\selectfont' + '\n' + r'\setlength{\abovedisplayskip}{1pt}\setlength{\belowdisplayskip}{1pt}')

          old = '\\[\n \\livewrite{\\lambda_{\\mathrm{MF}}=\\frac12\\log\\chi.}\n\\]'
          new = '\\begin{center}\n{\\fontsize{23}{27}\\selectfont \\livewrite{$\\lambda_{\\mathrm{MF}}=\\frac12\\log\\chi$}}\n\\end{center}'
          if old not in t:
              raise RuntimeError('Expected conditional Lyapunov block not found')
          t = t.replace(old, new)

          t = t.replace(r'\addplot[orange,fill=lightorange,fill opacity=.45,draw=none] coordinates {(-0.5,-1.35)(-0.5,1.35)(0.5,1.35)(0.5,-1.35)} -- cycle;', r'\path[fill=lightorange,opacity=.45] (axis cs:-0.5,-1.35) rectangle (axis cs:0.5,1.35);')
          content.write_text(t)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib nbformat nbconvert ipykernel

      - name: Build and execute notebook
        working-directory: teaching_oct20_revised
        run: |
          python build_notebook.py
          jupyter nbconvert --to notebook --execute ECE598_Oct20_DMFT_Lyapunov_DotsOnLine_revised.ipynb --inplace --ExecutePreprocessor.timeout=900

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-pictures texlive-fonts-recommended fonts-roboto poppler-utils zip

      - name: Compile three Beamer versions
        working-directory: teaching_oct20_revised
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error ECE598_L17_Oct20_unannotated.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error ECE598_L17_Oct20_annotated.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error ECE598_L17_Oct20_annotated_teacher.tex
          pdfinfo ECE598_L17_Oct20_unannotated.pdf
          pdfinfo ECE598_L17_Oct20_annotated.pdf
          pdfinfo ECE598_L17_Oct20_annotated_teacher.pdf

      - name: Package LaTeX sources
        working-directory: teaching_oct20_revised
        run: |
          zip -r ECE598_L17_Oct20_LaTeX_sources.zip ece598_theme.tex lecture17_content.tex ECE598_L17_Oct20_unannotated.tex ECE598_L17_Oct20_annotated.tex ECE598_L17_Oct20_annotated_teacher.tex build_notebook.py assets

      - name: Upload materials
        uses: actions/upload-artifact@v4
        with:
          name: ECE598-Oct20-revised-materials
          if-no-files-found: error
          path: |
            teaching_oct20_revised/ECE598_L17_Oct20_unannotated.pdf
            teaching_oct20_revised/ECE598_L17_Oct20_annotated.pdf
            teaching_oct20_revised/ECE598_L17_Oct20_annotated_teacher.pdf
            teaching_oct20_revised/ECE598_L17_Oct20_LaTeX_sources.zip
            teaching_oct20_revised/ECE598_Oct20_DMFT_Lyapunov_DotsOnLine_revised.ipynb
            teaching_oct20_revised/assets/convergence.pdf
            teaching_oct20_revised/assets/dots_on_line.pdf
          retention-days: 2
